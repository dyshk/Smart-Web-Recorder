<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Web Detector / 智能网页探测器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <div>
        <p class="eyebrow">当前网页 / Current Tab</p>
        <h1 id="tabTitle">正在准备... / Loading...</h1>
        <p id="tabUrl" class="url"></p>
      </div>

      <button id="openRecorder" type="button" disabled>打开探测器 / Open Detector</button>
      <p id="status" class="status">请选择包含音视频或可下载文件的网页。<br>Select a tab with audio, video, or downloadable files.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
