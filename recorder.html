<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能听力录音机</title>
    <link rel="stylesheet" href="recorder.css">
  </head>
  <body>
    <main class="recorder">
      <!-- ===== 顶部标题栏 ===== -->
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="mic-head"></span>
          <span class="mic-stem"></span>
          <span class="clip-corner"></span>
        </div>
        <h1>智能录音机</h1>

        <!--
          固定窗口置顶按钮
          点击后窗口将持续保持在浏览器最前面（通过监听焦点变化自动重聚焦实现）
          再次点击取消固定
        -->
        <button id="pinButton" class="pin-button" type="button"
                title="固定窗口置顶" aria-label="固定窗口置顶" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"/>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
          </svg>
        </button>
      </header>

      <!-- ===== 网页信息区 ===== -->
      <section class="source">
        <label>
          网址：
          <input id="pageUrl" type="text" readonly>
        </label>
        <label>
          标题：
          <input id="pageTitle" type="text" readonly>
        </label>
        <label class="check-row">
          <input id="muteMonitor" type="checkbox">
          静音网页回放
        </label>
      </section>

      <!-- ===== 状态与计时区 ===== -->
      <section class="status-row">
        <span id="status">就绪</span>
        <span id="clock">00:00.0</span>
      </section>

      <!--
        ===== 波形面板 =====
        画布高度从 190 缩小到 120，配合渐变色与间距优化使波形更精致美观
      -->
      <section class="wave-panel">
        <div class="meter" aria-label="音量">
          <span id="levelBar"></span>
        </div>
        <canvas id="timeline" width="900" height="120"></canvas>
        <div class="time-row">
          <span id="clipStartText">起点 00:00.0</span>
          <span id="clipEndText">终点 00:00.0</span>
        </div>
      </section>

      <!-- ===== 主操作按钮区 ===== -->
      <section class="primary-actions">
        <button id="startButton" type="button">开始录制</button>
        <button id="stopButton" type="button" disabled>停止</button>
        <button id="discardButton" type="button" disabled>丢弃</button>
        <button id="previewButton" type="button" disabled>试听片段</button>
      </section>

      <audio id="previewAudio" controls></audio>

      <!-- ===== 保存区 ===== -->
      <section class="save-row">
        <label>
          格式：
          <select id="formatSelect">
            <option value="webm">WEBM 音频</option>
            <option value="mp3">MP3 音频</option>
            <option value="wav">WAV 音频</option>
          </select>
        </label>
        <button id="downloadClipButton" type="button" disabled>保存片段</button>
        <button id="downloadFullButton" type="button" disabled>保存完整录音</button>
      </section>
    </main>

    <script src="recorder.js"></script>
  </body>
</html>
